<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WatchDesk — diagnosi foto</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#03061a;color:#eef1fb;font-family:'Outfit',sans-serif;padding:22px 16px 60px}
.w{max-width:820px;margin:0 auto}
h1{font-size:1.2rem;font-weight:800;margin-bottom:4px}
p.s{color:#8891b4;font-size:.86rem;margin-bottom:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
select,input{background:#070c26;border:1px solid #2a3768;border-radius:10px;color:#eef1fb;
 font-family:inherit;font-size:.95rem;padding:11px 12px}
input{flex:1;min-width:160px}
button{background:#d4b982;border:none;border-radius:10px;color:#0b1230;cursor:pointer;
 font-family:inherit;font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:12px 18px}
pre{background:#0b1230;border:1px solid #182352;border-radius:12px;padding:14px;
 font-family:'IBM Plex Mono',monospace;font-size:.76rem;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:#c9d1ee}
.ok{color:#7ddba3}.ko{color:#f0a4a3}.gold{color:#d4b982}
img.pv{max-width:190px;border-radius:10px;border:1px solid #2a3768;margin-top:12px;display:none;background:#fff}
</style></head><body><div class="w">
<h1>Diagnosi ricerca e foto</h1>
<p class="s">Usa la tua sessione. Mostra esattamente cosa risponde il Worker, passo per passo.</p>
<div class="row">
  <select id="brand">
    <option>Patek Philippe</option><option>Audemars Piguet</option><option>Rolex</option>
  </select>
  <input id="ref" value="5167A/001" placeholder="referenza">
  <button id="go">Prova</button>
</div>
<pre id="out">Pronto.</pre>
<img id="pv" class="pv" alt="">
</div>
<script>
'use strict';
var API='https://watchdesk-api.owscan.workers.dev';
var out=document.getElementById('out'), pv=document.getElementById('pv');
function log(s,cls){ out.innerHTML += '\n' + (cls?'<span class="'+cls+'">'+s+'</span>':s); }
function tok(){ try{ return localStorage.getItem('wd_token')||''; }catch(e){ return ''; } }

document.getElementById('go').addEventListener('click', function(){
  out.textContent=''; pv.style.display='none';
  var brand=document.getElementById('brand').value, ref=document.getElementById('ref').value.trim();
  var t=tok();
  log('token in memoria: ' + (t ? 'si (' + t.slice(0,6) + '…)' : 'NO — apri prima il portale e fai login'), t?'ok':'ko');
  if(!t) return;
  log('');
  log('1) RICERCA  /refsearch?brand=' + brand + '&ref=' + ref, 'gold');
  var t0=Date.now();
  fetch(API+'/refsearch?brand='+encodeURIComponent(brand)+'&ref='+encodeURIComponent(ref),
        {headers:{Authorization:'Bearer '+t}})
   .then(function(r){ log('   stato HTTP: '+r.status+'  ('+(Date.now()-t0)+' ms)', r.ok?'ok':'ko');
                      return r.json(); })
   .then(function(list){
     if(!Array.isArray(list)){ log('   risposta non è una lista: '+JSON.stringify(list).slice(0,300),'ko'); return; }
     log('   risultati: '+list.length, list.length?'ok':'ko');
     if(!list.length){ log('   → la referenza non viene trovata: il problema è la RICERCA, non la foto','ko'); return; }
     var it=list[0];
     log('   primo: ref='+it.ref+'  model='+(it.model||'—'));
     log('   img nel risultato: '+(it.img ? it.img : 'VUOTA'), it.img?'ok':'ko');
     log('   url scheda: '+(it.url||'—'));
     log('');
     log('2) DETTAGLIO  /refdetail', 'gold');
     var t1=Date.now();
     var qs='brand='+encodeURIComponent(brand)+'&ref='+encodeURIComponent(it.ref||'')+
            '&img='+encodeURIComponent(it.img||'')+'&url='+encodeURIComponent(it.url||'');
     return fetch(API+'/refdetail?'+qs,{headers:{Authorization:'Bearer '+t}})
       .then(function(r){ log('   stato HTTP: '+r.status+'  ('+(Date.now()-t1)+' ms)', r.ok?'ok':'ko'); return r.json(); })
       .then(function(d){
         if(d.error){ log('   errore dal Worker: '+d.error,'ko'); return; }
         log('   img usata: '+(d.img||'—'));
         log('   titolo: '+(d.title||'—'));
         log('   prezzo: '+(d.price||'—'));
         var ph=d.photo||'';
         log('   FOTO: '+(ph ? ('arrivata, '+Math.round(ph.length/1024)+' KB, tipo '+ph.slice(5,ph.indexOf(';'))) : 'VUOTA — il Worker non è riuscito a scaricare l\'immagine'), ph?'ok':'ko');
         if(ph){ pv.src=ph; pv.style.display='block'; }
         log('');
         log('3) PROVA DAL BROWSER (stessa immagine, senza Worker)','gold');
         var src=d.img||it.img;
         if(!src){ log('   nessun indirizzo immagine da provare','ko'); return; }
         ['diretta '+src, 'weserv https://images.weserv.nl/?url='+encodeURIComponent(src.replace(/^https?:\/\//,''))+'&w=400&output=jpg'].forEach(function(pair){
           var i=pair.indexOf(' '), etichetta=pair.slice(0,i), u=pair.slice(i+1);
           var im=new Image();
           im.onload=function(){ log('   '+etichetta+': OK ('+im.naturalWidth+'×'+im.naturalHeight+')','ok'); };
           im.onerror=function(){ log('   '+etichetta+': FALLITA','ko'); };
           im.src=u;
         });
       });
   })
   .catch(function(e){ log('ECCEZIONE: '+e.message,'ko'); });
});
</script></body></html>
